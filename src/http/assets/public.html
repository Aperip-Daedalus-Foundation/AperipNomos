<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Open-source licenses published by Aperip Daedalus Foundation.">
    <meta name="theme-color" content="#F5F7F5">
    <title>Licenses — AperipNomos</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <a class="skip-link" href="#catalog">Skip to licenses</a>

    <div class="site-shell">
      <header class="masthead">
        <div class="page-width masthead-grid">
          <a class="wordmark" href="/" aria-label="AperipNomos home">AperipNomos</a>
        </div>
      </header>

      <main id="catalog" class="page-width page-main" tabindex="-1">
        <section aria-labelledby="catalog-heading">
          <div class="section-heading">
            <h1 id="catalog-heading">Licenses</h1>
          </div>

          <div class="filter-bar">
            <div class="field filter-field">
              <label for="license-filter">Search licenses</label>
              <input
                id="license-filter"
                name="license-filter"
                type="search"
                inputmode="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Title or filename"
                disabled
              >
            </div>
            <p id="license-count" class="result-count" aria-live="polite"></p>
          </div>

          <div
            id="catalog-status"
            class="status-line"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            Loading…
          </div>

          <div id="license-list" class="license-list" aria-busy="true"></div>
        </section>

        <noscript>
          <p class="notice notice-error">
            JavaScript is required to load licenses.
          </p>
        </noscript>
      </main>

      <footer class="site-footer">
        <div class="page-width footer-rule">
          <small>Copyright (C) 2026 Aperip Daedalus Foundation. All rights reserved.</small>
        </div>
      </footer>
    </div>

    <script type="module" src="/assets/public.js"></script>
  </body>
</html>
