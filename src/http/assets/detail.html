<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Open-source license published by Aperip Daedalus Foundation.">
    <meta name="theme-color" content="#F5F7F5">
    <title>License — AperipNomos</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <a class="skip-link" href="#license-record">Skip to license</a>

    <div class="site-shell">
      <header class="masthead masthead-compact">
        <div class="page-width masthead-grid">
          <a class="wordmark" href="/" aria-label="AperipNomos home">AperipNomos</a>
          <nav class="archive-nav" aria-label="Licenses">
            <a class="back-link" href="/"><span aria-hidden="true">←</span> Back to licenses</a>
          </nav>
        </div>
      </header>

      <main id="license-record" class="page-width page-main detail-main" tabindex="-1">
        <div
          id="detail-status"
          class="status-line detail-status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          Loading…
        </div>

        <article id="detail-content" class="license-detail" hidden>
          <header class="detail-heading">
            <h1 id="license-title">License</h1>
          </header>

          <dl class="detail-metadata">
            <div>
              <dt>File</dt>
              <dd id="license-source"></dd>
            </div>
            <div>
              <dt>Published</dt>
              <dd id="license-uploaded"></dd>
            </div>
            <div class="metadata-wide">
              <dt>SHA-256</dt>
              <dd><code id="license-digest"></code></dd>
            </div>
          </dl>

          <section class="license-text" aria-label="License text">
            <div class="license-text-toolbar">
              <div class="copy-control">
                <button id="copy-license" class="button button-secondary" type="button" disabled>
                  Copy
                </button>
                <span id="copy-status" class="copy-status" role="status" aria-live="polite"></span>
              </div>
            </div>
            <div id="license-body" class="license-body"></div>
          </section>
        </article>

        <noscript>
          <p class="notice notice-error">
            JavaScript is required to load this license.
          </p>
        </noscript>
      </main>

      <footer class="site-footer">
        <div class="page-width footer-rule">
          <small>Copyright (C) 2026 Aperip Daedalus Foundation. All rights reserved.</small>
        </div>
      </footer>
    </div>

    <script type="module" src="/assets/detail.js"></script>
  </body>
</html>
